name: Deploy to GitHub Pages

# Builds the browser port and publishes it. The site holds the engine and the
# page only: players choose their own copy of the game in their browser.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build
        working-directory: crates/mm2-viewer
        # The site lives at https://rzrabbi.github.io/mcm2-web/, so the files are
        # linked from /mcm2-web/.
        run: trunk build --release --public-url /mcm2-web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/mm2-viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v4
